## Collapse compatible duplicate versions whenever pnpm writes the lockfile, so every install
## keeps it as lean as `pnpm dedupe` would. This replaces the `pnpm dedupe --check` CI step: the
## two algorithms can break ties differently, so the check could fail a lockfile that a plain
## `pnpm install` just wrote.
autoDedupe: true

ignoredBuiltDependencies:
  - nx ## Calls verifyOrUpdateNxCloudClient

linkWorkspacePackages: true

## Install packages only after they have been out for at least 8 hours, to reduce exposure to
## malicious releases that get unpublished quickly. Must stay in sync with the `minimumReleaseAge`
## floor in the Renovate preset (renovate-preset.json), so that Renovate never proposes a
## version pnpm would then refuse to lock.
minimumReleaseAge: 480

nodeLinker: isolated

packages:
  - packages/*

## Have `pnpm add` also add the matching `@types/*` package to devDependencies, when one exists
saveTypes: true

## Disable "Update available" banner (updates are handled by Renovate)
updateNotifier: false
