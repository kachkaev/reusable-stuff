name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    environment: release
    if: github.repository == 'kachkaev/reusable-stuff'
    name: Release
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true

      # npm scans a new version for malware for a few minutes before listing
      # it, so a run right after the one that published sees the version as
      # unpublished and fails with 409 Conflict on publishing it again. The
      # versions' tags, which changesets pushes after publishing, do not lag.
      # Drop this check once changesets handles the scan window:
      # https://github.com/changesets/changesets/issues/2195
      - name: Check if all package versions are already tagged
        id: version-tags
        run: |
          tags=$(pnpm ls --recursive --depth -1 --json | jq --raw-output '.[] | select(.private | not) | "\(.name)@\(.version)"')
          for tag in $tags; do
            git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null || exit 0
          done
          if [ -n "$tags" ]; then
            echo "all-exist=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release pull request or publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: Version packages
          version-script: pnpm changesets:version
          # An empty script makes the action skip publishing
          publish-script: ${{ steps.version-tags.outputs.all-exist != 'true' && 'pnpm changesets:publish' || '' }}
